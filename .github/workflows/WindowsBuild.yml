name: Windows Green Dictionary Build

on:
  workflow_run:
    workflows: [StartBuild]
    types:
      - requested

permissions:
  contents: read

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v3
      with:
        python-version: "3.12"
    - name: Install Pyinstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt
    - name: Build
      run: |
        pyinstaller -w RandomPerson.py
        copy LICENSE dist/RandomPerson/LICENSE
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RandomPersonWindows
        path: dist/*
